name: Test

on:
  workflow_call:

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install molten-vk

      - name: Set up solana-keygen
        uses: ./.github/actions/setup-solana-keygen

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: grincel-macos-arm64
          path: .

      - name: Make executable
        run: chmod +x grincel-macos-arm64

      - name: Test help
        run: ./grincel-macos-arm64 --help

      - name: Verify Metal + CPU keys with solana-keygen
        run: scripts/check-keys.sh ./grincel-macos-arm64 A:4

      - name: Verify suffix, case-sensitive keys
        run: scripts/check-keys.sh ./grincel-macos-arm64 Zz:2 --suffix -s

      - name: Verify wildcard keys
        run: scripts/check-keys.sh ./grincel-macos-arm64 'B?c:2' --anywhere

      - name: Verify Vulkan + CPU keys with solana-keygen
        run: scripts/check-keys.sh ./grincel-macos-arm64 C:4 --vulkan

      - name: Verify CPU keys with solana-keygen
        run: scripts/check-keys.sh ./grincel-macos-arm64 D:4 --cpu

      - name: Run benchmark
        run: ./grincel-macos-arm64 --benchmark

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up solana-keygen
        uses: ./.github/actions/setup-solana-keygen

      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: grincel-linux-amd64
          path: .

      - name: Make executable
        run: chmod +x grincel-linux-amd64

      - name: Install Vulkan runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Test help
        run: ./grincel-linux-amd64 --help

      - name: Verify CPU keys with solana-keygen
        run: scripts/check-keys.sh ./grincel-linux-amd64 A:4 --cpu

      - name: Verify suffix, case-sensitive CPU keys
        run: scripts/check-keys.sh ./grincel-linux-amd64 Zz:2 --suffix -s --cpu

  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up solana-keygen
        uses: ./.github/actions/setup-solana-keygen

      - name: Download Linux ${{ matrix.arch }} binary
        uses: actions/download-artifact@v4
        with:
          name: grincel-linux-${{ matrix.arch }}
          path: .

      - name: Rename binary
        run: mv grincel-linux-${{ matrix.arch }} grincel

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: grincel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test help
        run: docker run --rm grincel:test --help

      - name: Verify CPU keys with solana-keygen
        run: |
          cat > grincel-docker <<'EOF'
          #!/bin/sh
          exec docker run --rm -v "$PWD:/keys" -w /keys --user "$(id -u):$(id -g)" grincel:test "$@"
          EOF
          chmod +x grincel-docker
          scripts/check-keys.sh ./grincel-docker A:3 --cpu
